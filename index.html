<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DAY">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>DAY</title>

<style>
:root{
  --bg:#f4f2ec;
  --surface:#fbfaf7;
  --surface2:#eeece5;
  --line:#dedbd2;
  --text:#292a27;
  --muted:#85857e;
  --accent:#81927b;
  --accent-soft:#e1e7dd;
  --danger:#a5655f;
  --shadow:0 5px 20px rgba(45,45,38,.06);
  --radius:15px;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input,textarea{font:inherit}
button{color:inherit}
body{padding-bottom:env(safe-area-inset-bottom)}

.topbar{
  position:sticky;top:0;z-index:100;
  height:58px;
  display:flex;align-items:center;
  background:rgba(244,242,236,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:0 14px;
}
.nav{
  flex:1;
  display:flex;
  justify-content:center;
  gap:30px;
  height:100%;
}
.nav button{
  border:0;background:none;
  font-size:14px;font-weight:600;
  color:var(--muted);
  padding:0 2px;
  position:relative;
}
.nav button.active{color:var(--text)}
.nav button.active:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:3px;
  border-radius:3px 3px 0 0;
  background:var(--accent);
}
.icon-btn{
  border:0;background:none;
  width:38px;height:38px;
  border-radius:10px;
  cursor:pointer;
  font-size:19px;
}
.icon-btn:hover{background:var(--surface2)}

main{
  width:min(100%,760px);
  margin:0 auto;
  padding:18px 14px 70px;
}

.view{display:none}
.view.active{display:block}

button{cursor:pointer}

.soft-btn{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:10px;
  padding:9px 13px;
}
.soft-btn:active{transform:scale(.98)}

.primary-btn{
  border:0;
  background:var(--accent);
  color:white;
  border-radius:10px;
  padding:10px 14px;
}

.danger-btn{
  border:1px solid #d9bbb7;
  color:var(--danger);
  background:transparent;
  border-radius:10px;
  padding:9px 13px;
}

.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}

/* DAY */

.day-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}
.date-nav{
  display:flex;align-items:center;gap:5px;
}
.date-button{
  border:0;background:none;
  font-size:17px;font-weight:650;
  padding:8px 7px;
}
.arrow{
  border:0;background:none;
  font-size:22px;
  color:var(--muted);
  padding:5px 8px;
}

.diary-title{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--radius);
  padding:12px 14px;
  margin-bottom:10px;
  outline:none;
  font-size:16px;
  font-weight:650;
  box-shadow:var(--shadow);
}
.diary-title:focus{border-color:#bdc7b8}

.diary-text{
  width:100%;
  min-height:55vh;
  resize:vertical;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--radius);
  padding:17px;
  outline:none;
  line-height:1.75;
  font-size:16px;
  box-shadow:var(--shadow);
}
.diary-text:focus{border-color:#bdc7b8}

.tag-input{
  width:100%;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--surface);
  padding:12px 14px;
  outline:none;
}
.save-state{
  min-height:22px;
  padding:6px 3px 0;
  font-size:12px;
  color:var(--muted);
}

.search-panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:15px;
}
.segment{
  display:flex;
  padding:3px;
  background:var(--surface2);
  border-radius:10px;
  gap:3px;
}
.segment button{
  flex:1;
  border:0;background:transparent;
  padding:8px;
  border-radius:8px;
  color:var(--muted);
}
.segment button.active{
  background:var(--surface);
  color:var(--text);
  box-shadow:0 1px 5px rgba(0,0,0,.06);
}
.search-input{
  width:100%;
  margin-top:10px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  outline:none;
}
.search-result{
  padding:12px 3px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.search-result-date{font-weight:650;margin-bottom:4px}
@media(max-width:699px){.idea-modal-bg{align-items:flex-end;padding:0}.idea-modal{border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  #searchResults.list-mode .search-result-date{
    font-weight:500;
  }
}
.search-preview{
  font-size:14px;
  color:#55564f;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.tagline{font-size:12px;color:var(--accent);margin-top:5px}

/* PLAN */

.plan-tabs{
  display:flex;
  width:210px;
  margin:0 auto 18px;
  padding:3px;
  border-radius:11px;
  background:var(--surface2);
}
.plan-tabs button{
  flex:1;border:0;background:transparent;
  padding:8px;border-radius:8px;
  color:var(--muted);
}
.plan-tabs button.active{
  background:var(--surface);
  color:var(--text);
  font-weight:650;
}

.chip-create{
  display:flex;
  gap:7px;
  margin-bottom:11px;
}
.chip-create input{
  flex:1;min-width:0;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:11px;
  padding:11px 13px;
  outline:none;
}
.plus-btn{
  width:44px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:#fff;
  font-size:20px;
}

.loose-area{
  min-height:55px;
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:7px;
  padding:8px 3px 14px;
}

.chip{
  display:inline-flex;
  align-items:center;
  max-width:100%;
  padding:8px 11px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:0 2px 7px rgba(40,40,30,.04);
  font-size:14px;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}
.chip.done{
  opacity:.28;
}
.chip.dragging{opacity:.45}

.weekday-board{
  display:grid;
  gap:8px;
}
.day-row,.week-row{
  background:rgba(251,250,247,.55);
  border:1px solid var(--line);
  border-radius:13px;
  min-height:65px;
  padding:10px;
}
.day-label{
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.day-row.saturday .day-label{color:#55769b}
.day-row.sunday .day-label{color:#b2645f}
.day-row.anyweek{background:var(--accent-soft);border-color:#c7d0c2}
.day-row.anyweek .day-label{color:#667f61}
.drop-zone{
  min-height:32px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-content:flex-start;
}
.drop-hover{outline:2px solid #aebca8}

.week-row.current{
  background:var(--accent-soft);
  border-color:#c7d0c2;
}
.week-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:9px;
}
.week-number{
  font-size:11px;
  font-weight:500;
  color:var(--muted);
  margin-left:auto;
}
.week-dates{
  font-size:15px;
  font-weight:750;
  color:var(--text);
}
.week-minus{
  margin-left:auto;
  border:0;background:transparent;
  font-size:20px;color:var(--muted);
  padding:2px 7px;
}
.week-add-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:9px;
}
.add-week{
  width:100%;
  border:1px dashed #c9c6bc;
  background:transparent;
  border-radius:12px;
  padding:10px;
  margin-top:0;
  color:var(--muted);
  font-size:13px;
}
.plan-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:20px;
}

/* TODO */

.todo-section{
  margin-bottom:24px;
}
.section-title{
  font-size:14px;
  letter-spacing:.04em;
  font-weight:750;
  margin:0 0 9px 2px;
}
.todo-add{
  display:flex;gap:7px;margin-bottom:9px;
}
.todo-add input{
  flex:1;min-width:0;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:11px;
  padding:11px 13px;
  outline:none;
}
.todo-list{
  min-height:40px;
}
.todo-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  min-height:48px;
  padding:7px 8px;
}
.todo-item:first-child{border-radius:11px 11px 0 0}
.todo-item:last-child{border-radius:0 0 11px 11px;border-bottom:0}
.todo-item:only-child{border-radius:11px}
.check{
  width:21px;height:21px;
  border:1.5px solid #aaa99f;
  border-radius:6px;
  background:transparent;
  flex:none;
}
.todo-title{
  flex:1;
  line-height:1.4;
  word-break:break-word;
  cursor:text;
}
.todo-title-edit{
  flex:1;
  min-width:0;
  width:100%;
  border:1px solid #bdc7b8;
  background:var(--bg);
  border-radius:8px;
  padding:7px 9px;
  outline:none;
  line-height:1.4;
}
.drag-handle{
  padding:8px 5px;
  color:#aaa99f;
  cursor:grab;
  touch-action:none;
  font-size:18px;
}
.delete-mini{
  border:0;background:none;
  color:#aaa;
  padding:7px;
}

.completed-toggle{
  width:100%;
  display:flex;
  justify-content:space-between;
  border:0;
  border-top:1px solid var(--line);
  background:none;
  padding:15px 3px;
  font-weight:650;
}
.completed-group{margin:12px 0 20px}
.completed-date{
  font-size:12px;color:var(--muted);
  margin:14px 0 5px;
}
.completed-item{
  display:flex;
  gap:8px;
  align-items:center;
  padding:9px 4px;
  border-bottom:1px solid var(--line);
}
.completed-title{flex:1}
.completed-actions button{
  border:0;background:none;
  font-size:12px;
  color:var(--muted);
  padding:5px;
}
.schedule-add{
  display:grid;grid-template-columns:148px 1fr 44px;gap:0;margin-bottom:9px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden;
}
.schedule-add input{min-width:0;border:0;background:transparent;border-radius:0;padding:11px 13px;outline:none}
.schedule-add #scheduleDate{border-right:1px solid var(--line);color:var(--muted)}
.schedule-add .plus-btn{width:44px;border-radius:0}
.schedule-date{flex:none;font-size:12px;color:var(--muted);min-width:44px}
@media(max-width:520px){
  .schedule-add{
    grid-template-columns:minmax(142px,44%) minmax(0,1fr) 42px;
  }
  .schedule-add input{
    padding:10px 9px;
  }
  .schedule-add #scheduleDate{
    width:100%;
    min-width:0;
    padding-left:8px;
    padding-right:6px;
    font-size:14px;
  }
  .schedule-add #scheduleInput{
    width:100%;
    min-width:0;
    padding-left:10px;
    padding-right:8px;
  }
  .schedule-add .plus-btn{
    width:42px;
  }
}





@media(max-width:520px){
  .schedule-add{
    grid-template-columns:124px minmax(0,1fr) 42px;
    gap:6px;
  }
  .schedule-add #scheduleDate{
    box-sizing:border-box;
    width:124px;
    min-width:124px;
    padding:10px 5px;
    font-size:13px;
    letter-spacing:-0.2px;
    color:var(--text);
    color-scheme:light;
    -webkit-appearance:none;
    appearance:none;
    background:transparent;
    border-right:1px solid var(--line);
  }
  .schedule-add #scheduleDate::-webkit-calendar-picker-indicator{
    display:none !important;
    -webkit-appearance:none;
    opacity:0 !important;
    width:0 !important;
    height:0 !important;
    padding:0 !important;
    margin:0 !important;
  }
  .schedule-add #scheduleInput{
    min-width:0;
    padding-left:7px;
    padding-right:6px;
  }
}

/* PLAN layout refinements */
.chip-create .plan-trash{
  width:44px;min-width:44px;padding:0;
  border:0;border-radius:11px;
  background:var(--danger);color:#fff;
  font-size:24px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.plan-trash.drop-hover{filter:brightness(.9);outline:3px solid rgba(165,101,95,.20)}
.day-row{
  display:grid;grid-template-columns:42px minmax(0,1fr) 28px;align-items:stretch;gap:8px;
  min-height:82px;
}
.day-label{margin:0;display:flex;align-items:center;justify-content:center;min-height:60px}
.day-row .drop-zone{min-height:60px;align-content:flex-start}
.day-minus{grid-column:3;align-self:center;border:0;background:transparent;font-size:20px;color:var(--muted);padding:2px 5px}
.week-row{
  display:grid;grid-template-columns:48px minmax(0,1fr) 30px;align-items:stretch;gap:5px;min-height:82px;
}
.week-head{display:contents;margin:0}
.week-dates{
  display:inline-flex;align-self:center;justify-self:start;
  align-items:center;justify-content:center;text-align:center;
  font-size:13px;line-height:1.65;white-space:pre-line;
  position:relative;padding:0;
}
.week-dates::after{
  content:"";position:absolute;left:0;right:0;top:50%;
  height:1px;background:var(--line);transform:translateY(-50%);
}
.week-number{display:none}
.week-minus{grid-column:3;grid-row:1;align-self:center;margin:0}
.week-row>.drop-zone{grid-column:2;grid-row:1;min-height:60px;align-content:flex-start}
.diary-tag-row{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}
.quick-tags{display:flex;gap:6px;flex-wrap:wrap}
.quick-tag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 10px;font-size:13px;color:var(--muted)}
.quick-tag.active{background:var(--accent-soft);border-color:#bdc9b7;color:#53664f;font-weight:700}
.diary-tag-row .tag-input{flex:1;min-width:150px;width:auto;margin-top:0}
@media(max-width:520px){
  .chip-create .plan-trash{min-width:42px;width:42px;padding:0;font-size:23px}
  .day-row{grid-template-columns:38px minmax(0,1fr) 26px;min-height:82px}
  .week-row{grid-template-columns:48px minmax(0,1fr) 28px;min-height:82px}
  .week-dates{font-size:12px}
  .diary-tag-row{align-items:stretch}
  .quick-tags{width:100%}
  .diary-tag-row .tag-input{width:100%;flex-basis:100%}
}


.tag-preset-list{display:flex;flex-direction:column;gap:7px}
.tag-preset-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}
.tag-preset-item input,.tag-preset-add input{min-width:0;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;outline:none}
.tag-preset-actions{display:flex;gap:5px}
.tag-preset-actions button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px}
.tag-preset-actions .preset-delete{color:var(--danger);border-color:#d9bbb7}
.tag-preset-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:10px}


/* ANNUAL */
.annual-wrap{width:100%}
.annual-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.annual-year-nav{display:flex;align-items:center;gap:6px}
.annual-year{font-size:20px;font-weight:750;min-width:76px;text-align:center}
.annual-add{white-space:nowrap}
.annual-head-actions{display:flex;align-items:center;gap:7px}
.annual-settings-list{display:grid;gap:7px;max-height:52vh;overflow:auto}
.annual-settings-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.annual-settings-item input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.annual-settings-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.annual-empty{padding:42px 12px;text-align:center;color:var(--muted)}
.annual-desktop{display:block;overflow-x:visible;padding-bottom:8px}
.annual-grid{width:100%;min-width:0;background:transparent}
.annual-month-head,.annual-project-row{display:grid;grid-template-columns:150px minmax(0,1fr)}
.annual-project-name{padding:10px 14px 10px 2px;font-weight:750;display:flex;align-items:center;background:transparent}
.annual-project-name-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:700px){
  .annual-project-row{cursor:grab}
  .annual-project-row:active{cursor:grabbing}
  .annual-project-row.annual-dragging{opacity:.45}
  .annual-project-row.annual-drop-before{box-shadow:inset 0 2px 0 rgba(129,146,123,.55)}
  .annual-project-row.annual-drop-after{box-shadow:inset 0 -2px 0 rgba(129,146,123,.55)}
}
.annual-months{position:relative;height:38px}
.annual-month{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text);font-weight:700}
.annual-month.current{color:#53664f;font-weight:750;background:rgba(225,231,221,.55);border-radius:8px 8px 0 0}
.annual-project-row{min-height:58px}
.annual-track{position:relative;min-height:58px}
.annual-month-band{position:absolute;top:0;bottom:0;border-left:1px solid rgba(126,125,116,.11);pointer-events:none}
.annual-month-band.current{background:rgba(225,231,221,.38)}
.annual-month-band:last-of-type{border-right:1px solid rgba(126,125,116,.08)}
.annual-bar{position:absolute;top:12px;height:34px;border:0;border-radius:9px;padding:0 9px;font-size:12px;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:700;min-width:5px;text-align:center;display:flex;align-items:center;justify-content:center}
.annual-bar:hover{filter:brightness(.97)}
.annual-bar.short{padding:0;min-width:8px}
.annual-dot{position:absolute;top:23px;width:12px;height:12px;border:0;border-radius:50%;transform:translateX(-50%);cursor:pointer;box-shadow:0 0 0 3px var(--bg)}
.annual-dot:hover{transform:translateX(-50%) scale(1.15)}
.annual-mobile{display:none}
.annual-month-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px;min-height:112px;overflow:hidden}
.annual-month-card.current{background:var(--accent-soft);border-color:#c7d0c2}
.annual-month-title{font-size:13px;font-weight:800;margin-bottom:7px}
.annual-card-item{font-size:10.5px;line-height:1.25;padding:5px 6px;border:0;border-radius:7px;cursor:pointer;margin-top:5px;overflow:hidden}
.annual-card-project{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.annual-card-meta{font-size:9.5px;margin-top:2px;text-align:center;font-weight:700;opacity:.9}
.annual-form{display:grid;gap:11px}.annual-form label{font-size:12px;color:var(--muted);display:grid;gap:5px}.annual-form input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:10px;outline:none}.annual-form input[type="color"]{height:42px;padding:4px;cursor:pointer}.annual-form-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}.annual-edit-actions{display:flex;justify-content:space-between;gap:8px;margin-top:5px}.annual-edit-actions-right{display:flex;gap:7px}
@media(max-width:699px){
  .annual-desktop{display:none}
  .annual-mobile{
    display:grid;

  .nav button:hover{box-shadow:none;color:var(--text)}
  .plan-tabs button:hover,.sub-tabs button:hover{background:rgba(255,255,255,.45);box-shadow:none}
  .type-chip:hover,.chip-clip-actions button:hover,.log-tools button:hover,.log-add:hover,.soft-btn:hover,.danger-btn:hover,.add-week:hover{border-color:#c5beb0;background:var(--surface2)}
  button:active:not(:disabled){transform:translateY(1px) scale(.985)}
}
/* PLAN tabs: slightly wider and optically centered */
.plan-tabs{width:276px;margin-left:auto;margin-right:auto;padding:3px;border-radius:12px}
.plan-tabs button{padding:5px 13px;border-radius:9px;font-size:12px;font-weight:750}
/* DAY/LOG lives inside the original header, using PLAN tab language */
.day-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:13px}
.day-actions{justify-self:end;display:flex}
.day-inline-tabs{width:184px;margin:0;padding:4px;border-radius:14px;background:var(--surface2)}
.day-inline-tabs button{padding:8px 12px;border-radius:10px}
/* chip library and copy/paste form one continuous wrapping line */
.loose-line{display:flex;align-items:flex-start;gap:8px;min-height:55px;padding:0 3px 8px}
.loose-line .loose-area{flex:1;min-width:0;min-height:47px;padding:8px 0 6px}
.chip-clip-actions{flex:none;margin:8px 0 0;align-self:flex-start;white-space:nowrap}
/* IDEA controls: exact common control height */
#ideaView .idea-meta .idea-field input[type="date"],#ideaView .idea-meta .idea-field select,#ideaView .idea-meta .idea-ai,
#ideaView .idea-filter-row input,#ideaView .idea-filter-row select,#ideaView .idea-filter-row .idea-year,#ideaView #ideaRandomBtn,#ideaView #ideaSettingsBtn{height:42px;min-height:42px;box-sizing:border-box}
#ideaView .idea-ai{padding-top:0;padding-bottom:0}
#ideaView #ideaRandomBtn,#ideaView #ideaSettingsBtn{padding:0}
/* LOG selected chips remain readable */
.type-chip.on,.morect-check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.morect-number{width:100%;height:42px;box-sizing:border-box;text-align:center;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;font:inherit;font-weight:800;outline:none;padding:0 4px}
.morect-number::placeholder{color:var(--muted);opacity:1}
.session-top:empty{display:none}.session-top{margin-bottom:8px}.session-badge{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;padding:0 8px;border-radius:999px;background:var(--soft);color:var(--text);font-size:12px;font-weight:850}
.log-card-head small{font-size:11px}.log-range{display:none}
/* MONTH: large wide cards; 3 columns on wide desktop */
.month-row{display:grid;grid-template-columns:1fr 34px;grid-template-rows:auto 1fr;gap:8px;min-height:260px;margin:0;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(251,250,247,.55)}
.month-head{grid-column:1;grid-row:1;background:transparent;justify-content:flex-start;text-align:left;font-size:17px;font-weight:850;padding:2px 4px;border-radius:0}
.month-row>.drop-zone{grid-column:1;grid-row:2;min-height:195px;padding:7px 4px;align-content:flex-start}
.month-minus{grid-column:2;grid-row:1;align-self:center}
#monthRows{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){
  #monthRows{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .month-row{min-height:270px}
}
@media(min-width:1600px){#monthRows{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.month-row{min-height:285px}}
@media(max-width:699px){
  .plan-tabs{width:258px;padding:3px}
  .plan-tabs button{padding:5px 10px;font-size:12px}
  .day-header{grid-template-columns:auto 1fr auto;gap:5px}
  .day-inline-tabs{width:128px;justify-self:center;padding:3px}
  .day-inline-tabs button{padding:7px 7px;font-size:12px}
  .date-nav{gap:0}.date-button{font-size:15px;padding-left:3px;padding-right:3px}.arrow{padding-left:3px;padding-right:3px}
  .day-actions .icon-btn{width:34px}
  .loose-line{gap:5px}.chip-clip-actions{gap:3px}.chip-clip-actions button{padding:5px 7px}
  .month-row{min-height:230px}.month-row>.drop-zone{min-height:165px}
}


/* DAY recent diary preview */
.diary-grid-panel{padding:2px 0 28px}
.diary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.diary-preview-card{min-width:0;height:128px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:var(--text);overflow:hidden}
.diary-preview-card:hover{border-color:#c7c3b8;background:#f7f5ef}
.diary-preview-date{font-size:10px;color:var(--muted);margin-bottom:5px;white-space:nowrap}
.diary-preview-title{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.diary-preview-text{font-size:11px;line-height:1.42;color:#66675f;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
#diaryGridToggle{font-size:18px;font-weight:800;color:var(--muted)}
@media(max-width:699px){
  .diary-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .diary-preview-card{height:112px;padding:8px 7px;border-radius:10px}
  .diary-preview-date{font-size:9px;margin-bottom:4px}
  .diary-preview-title{font-size:11px;margin-bottom:3px}
  .diary-preview-text{font-size:10px;line-height:1.35;-webkit-line-clamp:5}
  #diaryGridToggle{font-size:16px}
}

/* V2 LOG desktop layout + unified header controls */
.log-wrap{width:100%;max-width:none;margin:0;padding-bottom:40px}
.log-trash-top{justify-self:start;color:var(--danger);font-size:25px;font-weight:700}
.day-delete-top{color:var(--danger)!important;font-size:25px!important;font-weight:700!important}
.log-csv-top{color:#587451!important;font-size:18px!important;font-weight:800!important}
.day-actions .icon-btn,#searchToggle,#diaryGridToggle,#deleteDiary,#logCsvTop{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:19px;padding:0}
.month-row.current{background:var(--accent-soft);border-color:#c7d0c2}
@media(min-width:700px){
  #logEditor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  #logEditor.hidden{display:none!important}
  #logEditor>.log-card{margin:0}
  #logEditor>.log-card:first-child{grid-column:1/-1;display:grid;grid-template-columns:minmax(150px,.7fr) minmax(320px,1.5fr);gap:9px 12px;align-items:end}
  #logEditor>.log-card:first-child .log-card-head{grid-column:1/-1;margin-bottom:0}
  #logEditor>.log-card:first-child>.log-label:nth-of-type(1){grid-column:1}
  #logSchedule{grid-column:1}
  #logEditor>.log-card:first-child>.log-label:nth-of-type(2){grid-column:2;grid-row:2}
  #morectBox{grid-column:2;grid-row:3}
  .progress-pair{grid-column:1/-1;grid-template-columns:1fr 1fr;margin-top:2px}
  #logEditor>.log-card:first-child>.log-label:nth-of-type(3){grid-column:1/-1}
  #logDaily{grid-column:1/-1;min-height:52px}
  #logEditor>.log-card:nth-child(2){grid-column:1/-1}
  #mainSessions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  #mainSessions .session{margin:0}
  #logEditor>.log-card:nth-child(3){grid-column:1}
  #logEditor>.log-card:nth-child(4){grid-column:2}
}
@media(max-width:699px){.log-trash-top{width:34px;height:34px;font-size:22px}.day-actions .icon-btn,#searchToggle,#diaryGridToggle,#deleteDiary,#logCsvTop{width:34px;height:34px;font-size:18px}.log-csv-top{font-size:16px!important}.morect-number{height:38px}}

/* LOG visual polish: keep DAY header geometry and add gentle card separation */
.day-header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-inline-tabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1}
#dayDateNav{flex:none;z-index:2}
.day-actions{margin-left:auto;z-index:2;min-width:76px;justify-content:flex-end}
.log-card{background:var(--surface);border-color:#d7d4ca;box-shadow:0 3px 12px rgba(45,45,38,.045)}
#logEditor>.log-card:first-child,#logEditor>.log-card:nth-child(2),#logEditor>.log-card:nth-child(3),#logEditor>.log-card:nth-child(4){background:#f8f7f2}
.session{background:rgba(238,236,229,.58);border-color:#d9d6cc}
.session-badge{background:var(--accent-soft);color:#52654f;border:1px solid #cbd5c7;font-size:14px;font-weight:900;min-width:29px;height:29px}
.log-add{background:rgba(238,236,229,.34)}
@media(max-width:699px){
  .day-header{gap:5px}
  .day-inline-tabs{width:128px}
  .day-actions{min-width:68px}
}
</style>

</head>

<body>

<header class="topbar">
  <nav class="nav">
    <button data-main="day">DAY</button>
    <button data-main="plan" class="active">PLAN</button>
    <button data-main="todo">TODO</button>
    <button data-main="idea">IDEA</button>
    <button data-main="annual">YEAR</button>
  </nav>
  <button class="icon-btn" id="settingsBtn" aria-label="설정">⚙</button>
</header>

<main>

<!-- DAY -->
<section id="dayView" class="view">
  <div class="day-header">
    <div class="date-nav" id="dayDateNav">
      <button class="arrow" id="prevDay">‹</button>
      <button class="date-button" id="dateButton"></button>
      <button class="arrow" id="nextDay">›</button>
      <input id="datePicker" type="date" class="hidden">
    </div>
    <div class="sub-tabs day-inline-tabs"><button id="dayInnerTab" class="active">DAY</button><button id="logInnerTab">LOG</button></div>
    <div class="day-actions">
      <button class="icon-btn log-csv-top hidden" id="logCsvTop" aria-label="LOG CSV 내보내기">＋</button>
      <button class="icon-btn" id="searchToggle">⌕</button>
      <button class="icon-btn" id="diaryGridToggle" aria-label="최근 일기 미리보기">≡</button>
      <button class="icon-btn day-delete-top" id="deleteDiary" aria-label="일기 삭제">−</button>
      <button class="icon-btn log-trash-top hidden" id="logTrashTop" aria-label="LOG 비우기">−</button>
    </div>
  </div>

  <div id="searchPanel" class="search-panel hidden">
    <div class="segment">
      <button id="searchTitleBtn" class="active">제목</button>
      <button id="searchContentBtn">본문</button>
      <button id="searchTagBtn">태그</button>
      <button id="searchListBtn">목록</button>
    </div>
    <input class="search-input" id="searchInput" placeholder="검색">
    <div id="searchResults"></div>
  </div>

  <div id="diaryGridPanel" class="diary-grid-panel hidden">
    <div id="diaryGrid" class="diary-grid"></div>
  </div>

  <div id="diaryEditor">
    <input id="diaryTitle" class="diary-title" type="text" placeholder="제목" autocomplete="off">
    <textarea id="diaryText" class="diary-text"
      placeholder="오늘의 기록을 남겨보세요."></textarea>

    <div class="diary-tag-row">
      <div class="quick-tags" id="quickTags">
        <button type="button" class="quick-tag" data-tag="일상">일상</button>
        <button type="button" class="quick-tag" data-tag="일정">일정</button>
        <button type="button" class="quick-tag" data-tag="업무">업무</button>
        <button type="button" class="quick-tag" data-tag="특별">특별</button>
        <button type="button" class="quick-tag" data-tag="생각">생각</button>
      </div>
      <input id="tagInput" class="tag-input" placeholder="태그 입력">
    </div>

    <div id="saveState" class="save-state"></div>
  </div>

  <div id="logEditor" class="log-wrap hidden">
    <div class="log-card">
      <div class="log-card-head"><h3>오늘 기록</h3><small id="logDateLabel"></small></div>
      <label class="log-label">일정</label><input id="logSchedule" class="log-input" placeholder="일정">
      <label class="log-label">MORECT</label>
      <div class="morect" id="morectBox"></div>
      <div class="progress-pair">
        <div class="row"><input id="logTitle1" class="log-input" placeholder="제목 1"><input id="logRecord1" class="log-input" placeholder="기록 1"></div>
        <div class="row"><input id="logTitle2" class="log-input" placeholder="제목 2"><input id="logRecord2" class="log-input" placeholder="기록 2"></div>
      </div>
      <label class="log-label">데일리 로그</label><textarea id="logDaily" class="log-textarea" placeholder="오늘의 로그"></textarea>
    </div>
    <div class="log-card"><div class="log-card-head"><h3>메인</h3><small>작업할 때마다 추가</small></div><div id="mainSessions"></div><button id="addMainSession" class="log-add">＋ 메인 기록</button></div>
    <div class="log-card"><div class="log-card-head"><h3>서브</h3><small>누적형</small></div><div id="subSession"></div></div>
    <div class="log-card"><div class="log-card-head"><h3>IN &amp; DO</h3><small>누적형</small></div><div id="indoSession"></div></div>
    
  </div>
</section>

<!-- PLAN -->
<section id="planView" class="view active">

  <div class="plan-tabs">
    <button id="weekdayTab" class="active">요일</button>
    <button id="weeklyTab">주간</button>
    <button id="monthlyTab">월간</button>
  </div>

  <!-- WEEKDAY -->
  <div id="weekdayPlan">
    <div class="chip-create">
      <input id="weekdayChipInput" placeholder="할 일">
      <button class="plus-btn" id="weekdayChipAdd">＋</button>
       <button class="plan-trash" id="weekdayTrash" aria-label="삭제">−</button>
    </div>

    <div class="loose-line"><div class="loose-area drop-zone" id="weekdayLoose" data-zone="loose"></div><div class="chip-clip-actions"><button data-chip-copy="weekday">복사</button><button data-chip-paste="weekday">붙여넣기</button></div></div>

    <div class="weekday-board" id="weekdayBoard"></div>
    <div class="week-add-actions">
      <button class="add-week" id="addWeekdayDay">＋ 요일 추가</button>
      <button class="add-week" id="addWeekdayWeek">주간 추가 ＋</button>
    </div>

    <div class="plan-actions">
      <button class="soft-btn" id="weekdayDoneDelete">완료 삭제</button>
      <button class="danger-btn" id="weekdayAllDelete">전체 삭제</button>
    </div>
  </div>

  <!-- WEEKLY -->
  <div id="weeklyPlan" class="hidden">
    <div class="chip-create">
      <input id="weeklyChipInput" placeholder="할 일">
      <button class="plus-btn" id="weeklyChipAdd">＋</button>
       <button class="plan-trash" id="weeklyTrash" aria-label="삭제">−</button>
    </div>

    <div class="loose-line"><div class="loose-area drop-zone" id="weeklyLoose" data-zone="loose"></div><div class="chip-clip-actions"><button data-chip-copy="weekly">복사</button><button data-chip-paste="weekly">붙여넣기</button></div></div>

    <div id="weekRows"></div>
    <div class="week-add-actions">
      <button class="add-week" id="addPrevWeek">＋ 이전 주</button>
      <button class="add-week" id="addNextWeek">다음 주 ＋</button>
    </div>

    <div class="plan-actions">
      <button class="soft-btn" id="weeklyDoneDelete">완료 삭제</button>
      <button class="danger-btn" id="weeklyAllDelete">전체 삭제</button>
    </div>
  </div>

  <div id="monthlyPlan" class="hidden">
    <div class="chip-create"><input id="monthlyChipInput" placeholder="할 일"><button class="plus-btn" id="monthlyChipAdd">＋</button><button class="plan-trash" id="monthlyTrash" aria-label="삭제">−</button></div>
    <div class="loose-line"><div class="loose-area drop-zone" id="monthlyLoose" data-zone="loose"></div><div class="chip-clip-actions"><button data-chip-copy="monthly">복사</button><button data-chip-paste="monthly">붙여넣기</button></div></div>
    <div id="monthRows"></div><div class="week-add-actions"><button class="add-week" id="addPrevMonth">＋ 이전 달</button><button class="add-week" id="addNextMonth">다음 달 ＋</button></div>
    <div class="plan-actions"><button class="soft-btn" id="monthlyDoneDelete">완료 삭제</button><button class="danger-btn" id="monthlyAllDelete">전체 삭제</button></div>
  </div>
</section>


<!-- IDEA -->
<section id="ideaView" class="view">
  <div class="idea-compose">
    <div class="idea-meta">
      <div class="idea-field"><label>날짜</label><input id="ideaDate" type="date"></div>
      <div class="idea-field"><label>분류</label><select id="ideaCategory"></select></div>
      <label class="idea-ai"><input id="ideaAI" type="checkbox"> AI</label>
    </div>
    <label>IDEA</label>
    <textarea id="ideaText" placeholder="오늘의 컨셉을 기록하세요."></textarea>
    <div class="idea-actions"><button class="idea-btn" id="ideaCancel" style="display:none">새 IDEA</button></div>
    <div class="idea-status" id="ideaStatus"></div>
  </div>
  <div class="idea-tools">
    <div class="idea-filter-row">
      <input id="ideaSearch" type="search" placeholder="기록 검색">
      <select id="ideaFilterCat"><option value="">전체 분류</option></select>
      <select id="ideaFilterAI"><option value="">전체 출처</option><option value="human">직접</option><option value="ai">AI</option></select>
      <select id="ideaSort"><option value="new">최신순</option><option value="old">오래된순</option></select>
      <label class="idea-year"><input id="ideaThisYear" type="checkbox" checked> 올해만</label>
      <button class="idea-btn idea-settings-btn" id="ideaRandomBtn" aria-label="랜덤 IDEA" title="랜덤 IDEA">⚄</button>
    </div>
  </div>
  <div class="idea-list" id="ideaList"></div>
</section>

<!-- ANNUAL -->
<section id="annualView" class="view">
  <div class="annual-wrap">
    <div class="annual-head">
      <div class="annual-year-nav">
        <button class="arrow" id="annualPrevYear">‹</button>
        <div class="annual-year" id="annualYear"></div>
        <button class="arrow" id="annualNextYear">›</button>
      </div>
      <div class="annual-head-actions">
        <button class="soft-btn annual-add" id="annualSettingsBtn">설정</button>
        <button class="primary-btn annual-add" id="annualAdd">＋ 추가</button>
      </div>
    </div>
    <div id="annualDesktop" class="annual-desktop"></div>
    <div id="annualMobile" class="annual-mobile"></div>
  </div>
</section>

<!-- TODO -->
<section id="todoView" class="view">

  <div class="todo-section">
    <div class="section-title">Todo</div>
    <div class="todo-add">
      <input id="todoInput" placeholder="할 일">
      <button class="plus-btn" id="todoAdd">＋</button>
    </div>
    <div id="todoList" class="todo-list" data-list="todo"></div>
  </div>

  <div class="todo-section">
    <div class="section-title">Schedule</div>
    <div class="schedule-add">
      <input id="scheduleDate" type="date">
      <input id="scheduleInput" placeholder="일정">
      <button class="plus-btn" id="scheduleAdd">＋</button>
    </div>
    <div id="scheduleList" class="todo-list" data-list="schedule"></div>
  </div>

  <div class="todo-section">
    <div class="section-title">Someday</div>
    <div class="todo-add">
      <input id="somedayInput" placeholder="언젠가 할 일">
      <button class="plus-btn" id="somedayAdd">＋</button>
    </div>
    <div id="somedayList" class="todo-list" data-list="someday"></div>
  </div>

  <button class="completed-toggle" id="completedToggle">
    <span>완료 <span id="completedCount">0(0)</span></span>
    <span id="completedArrow">⌄</span>
  </button>

  <div id="completedList" class="hidden"></div>
</section>

</main>

<!-- SETTINGS -->

<div id="ideaRandomModal" class="idea-modal-bg hidden">
  <div class="idea-modal">
    <div class="modal-head"><h2>랜덤 IDEA</h2><button class="icon-btn" id="ideaRandomClose">×</button></div>
    <div id="ideaRandomBody"></div>
  </div>
</div>

<div id="settingsModal" class="modal-bg hidden">
  <div class="settings">
    <div class="modal-head">
      <h2>설정</h2>
      <button class="icon-btn" id="settingsClose">×</button>
    </div>

    <div class="settings-card">
      <h3>데이터 현황</h3>
      <div class="stat-grid">
        <div class="stat"><span>올해 일기</span><b id="statDiaryYear">0</b></div>
        <div class="stat"><span>전체 일기</span><b id="statDiaryAll">0</b></div>
        <div class="stat"><span>올해 TODO</span><b id="statTodoYear">0</b></div>
        <div class="stat"><span>전체 TODO</span><b id="statTodoAll">0</b></div>
        <div class="stat"><span>올해 IDEA</span><b id="statIdeaYear">0</b></div>
        <div class="stat"><span>전체 IDEA</span><b id="statIdeaAll">0</b></div>
      </div>
    </div>

    <div class="settings-card">
      <h3>전체 데이터</h3>
      <div class="setting-buttons">
        <button class="soft-btn" id="jsonBackup">백업</button>

<script>
/* =========================================================
   DATABASE
========================================================= */

const DB_NAME = "DAY_APP_DB";
const DB_VERSION = 1;
const STORE = "app";

let db;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);

    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE);
      }
    };

    req.onsuccess=e=>{
      db=e.target.result;
      resolve();
    };

    req.onerror=()=>reject(req.error);
  });
}

function dbGet(key){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly");
    const req=tx.objectStore(STORE).get(key);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}

function dbSet(key,value){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

const defaultData={
  version:1,
  diaries:{},
  tagPresets:["일상","일정","업무","특별","생각"],

/* =========================================================
   DATE UTILITIES
========================================================= */

function pad(n){return String(n).padStart(2,"0")}

function localDateString(date=new Date()){
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}

function parseDate(s){
  const [y,m,d]=s.split("-").map(Number);
  return new Date(y,m-1,d,12,0,0);
}

function addDays(date,n){
  const d=new Date(date);
  d.setDate(d.getDate()+n);
  return d;
}

function formatKoreanDate(s){
  const d=parseDate(s);
  return `${d.getFullYear()}. ${pad(d.getMonth()+1)}. ${pad(d.getDate())}`;
}

function shortDate(d){
  return `${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
}

/* ISO WEEK */

function isoWeekInfo(date){
  const d=new Date(Date.UTC(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  ));

  const day=d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate()+4-day);

  const isoYear=d.getUTCFullYear();
  const yearStart=new Date(Date.UTC(isoYear,0,1));

  const week=Math.ceil((((d-yearStart)/86400000)+1)/7);

  const jan4=new Date(isoYear,0,4);
  const jan4Day=jan4.getDay() || 7;
  const firstMonday=addDays(jan4,1-jan4Day);

  const monday=addDays(firstMonday,(week-1)*7);
  const sunday=addDays(monday,6);

  const dec28=new Date(isoYear,11,28);
  const totalWeeks=isoWeekNumberOnly(dec28);

  return {isoYear,week,totalWeeks,monday,sunday};
}

function isoWeekNumberOnly(date){
  const d=new Date(Date.UTC(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  ));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-yearStart)/86400000)+1)/7);
}

function weekKey(info){
  return `${info.isoYear}-W${pad(info.week)}`;
}

function infoFromWeekKey(key){
  const m=key.match(/^(\d+)-W(\d+)$/);
  if(!m)return null;

  const year=Number(m[1]);
  const week=Number(m[2]);

  const jan4=new Date(year,0,4,12);
  const day=jan4.getDay()||7;
  const firstMonday=addDays(jan4,1-day);
  const monday=addDays(firstMonday,(week-1)*7);

  return isoWeekInfo(monday);
}

function nextWeekKey(key){
  const info=infoFromWeekKey(key);
  return weekKey(isoWeekInfo(addDays(info.monday,7)));
}

function prevWeekKey(key){
  const info=infoFromWeekKey(key);
  return weekKey(isoWeekInfo(addDays(info.monday,-7)));
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

async function saveAll(){

function downloadText(filename,text,type="text/plain"){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

let selectedDate=localDateString();
let diaryTimer=null;
let searchMode="title";

const diaryTitle=document.getElementById("diaryTitle");
const diaryText=document.getElementById("diaryText");
const tagInput=document.getElementById("tagInput");
const DEFAULT_TAG_PRESETS=["일상","일정","업무","특별","생각"];
let activeQuickTags=new Set();

function getTagPresets(){
  if(!Array.isArray(data.tagPresets)) data.tagPresets=[...DEFAULT_TAG_PRESETS];
  return data.tagPresets;
}
function renderQuickTags(){
  const box=document.getElementById("quickTags");
  box.innerHTML="";
  getTagPresets().forEach(tag=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="quick-tag";
    btn.dataset.tag=tag;
    btn.textContent=tag;
    btn.classList.toggle("active",activeQuickTags.has(tag));
    btn.onclick=()=>{
      if(activeQuickTags.has(tag)) activeQuickTags.delete(tag);
      else activeQuickTags.add(tag);
      btn.classList.toggle("active",activeQuickTags.has(tag));
      scheduleDiarySave();
    };
    box.appendChild(btn);
  });
}

function renderDiary(){
  document.getElementById("dateButton").textContent=
    formatKoreanDate(selectedDate);

  const entry=data.diaries[selectedDate]||{};
  diaryTitle.value=entry.title||"";
  diaryText.value=entry.text||"";
  const tags=entry.tags||[];
  const presets=getTagPresets();
  activeQuickTags=new Set(tags.filter(t=>presets.includes(t)));
  tagInput.value=tags.filter(t=>!presets.includes(t)).join(", ");
  renderQuickTags();
  document.getElementById("saveState").textContent="";
  if(window.renderLog) window.renderLog();
}

async function saveDiary(){
  const title=diaryTitle.value;
  const text=diaryText.value;
  const customTags=tagInput.value
    .split(",")
    .map(v=>v.trim())
    .filter(Boolean);
  const tags=[...activeQuickTags,...customTags.filter(t=>!activeQuickTags.has(t))];

  if(!title.trim() && !text.trim() && !tags.length){
    delete data.diaries[selectedDate];
  }else{
    data.diaries[selectedDate]={
      title,
      text,
      tags,
      updatedAt:Date.now()
    };
  }

  await saveAll();

  document.getElementById("saveState").textContent="저장됨";
  setTimeout(()=>{
    document.getElementById("saveState").textContent="";
  },1000);
}

function scheduleDiarySave(){
  document.getElementById("saveState").textContent="저장 중…";
  clearTimeout(diaryTimer);
  diaryTimer=setTimeout(saveDiary,450);
}

diaryTitle.addEventListener("input",scheduleDiarySave);
diaryText.addEventListener("input",scheduleDiarySave);
tagInput.addEventListener("input",scheduleDiarySave);


const DIARY_HEIGHT_KEY="DAY_DIARY_HEIGHT";
function restoreDiaryHeight(){
  const h=Number(localStorage.getItem(DIARY_HEIGHT_KEY));
  if(Number.isFinite(h)&&h>=180) diaryText.style.height=h+"px";
}
let diaryResizeTimer=null;
if("ResizeObserver" in window){
  new ResizeObserver(entries=>{
    const h=Math.round(entries[0]?.contentRect.height||0);
    if(h<180)return;
    clearTimeout(diaryResizeTimer);
    diaryResizeTimer=setTimeout(()=>localStorage.setItem(DIARY_HEIGHT_KEY,String(h)),180);
  }).observe(diaryText);
}
restoreDiaryHeight();

document.getElementById("prevDay").onclick=()=>{
  selectedDate=localDateString(addDays(parseDate(selectedDate),-1));
  renderDiary();
};

document.getElementById("nextDay").onclick=()=>{
  selectedDate=localDateString(addDays(parseDate(selectedDate),1));
  renderDiary();
};

document.getElementById("dateButton").onclick=()=>{
  const picker=document.getElementById("datePicker");
  picker.value=selectedDate;

  if(picker.showPicker) picker.showPicker();
  else picker.click();
};

document.getElementById("datePicker").onchange=e=>{
  if(e.target.value){
    selectedDate=e.target.value;
    renderDiary();
  }
};

document.getElementById("deleteDiary").onclick=async()=>{
  if(!data.diaries[selectedDate])return;

  if(await confirmBox("이 일기를 삭제할까요?")){
    delete data.diaries[selectedDate];
    await saveAll();
    renderDiary();
  }
};


/* RECENT DIARY PREVIEW */
function recentDiaryEntries(){
  return Object.entries(data.diaries||{})
    .filter(([date,e])=>date&&e&&((e.title||"").trim()||(e.text||"").trim()||(e.tags||[]).length))
    .sort((a,b)=>{
      const au=Number(a[1]?.updatedAt)||0, bu=Number(b[1]?.updatedAt)||0;
      if(au!==bu)return bu-au;
      return b[0].localeCompare(a[0]);
    })
    .slice(0,63);
}
function renderDiaryGrid(){
  const box=document.getElementById("diaryGrid");
  box.innerHTML="";
  const entries=recentDiaryEntries();
  if(!entries.length){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="아직 작성한 일기가 없습니다.";
    box.appendChild(empty);
    return;
  }
  entries.forEach(([date,e])=>{
    const card=document.createElement("button");
    card.type="button";
    card.className="diary-preview-card";
    const d=document.createElement("div");
    d.className="diary-preview-date";
    d.textContent=date;
    const title=document.createElement("div");
    title.className="diary-preview-title";
    title.textContent=(e.title||"").trim()||"제목 없음";
    const preview=document.createElement("div");
    preview.className="diary-preview-text";
    preview.textContent=(e.text||"").trim()||(e.tags||[]).map(t=>"#"+t).join(" ")||"";
    card.append(d,title,preview);
    card.onclick=()=>{
      selectedDate=date;
      renderDiary();
      closeDiaryGrid();
    };
    box.appendChild(card);
  });
}
function closeDiaryGrid(){
  document.getElementById("diaryGridPanel").classList.add("hidden");
  document.getElementById("diaryEditor").classList.remove("hidden");
  document.getElementById("dayDateNav").classList.remove("hidden");
  document.getElementById("searchToggle").classList.remove("hidden");
  document.getElementById("deleteDiary").classList.remove("hidden");
  const btn=document.getElementById("diaryGridToggle");
  btn.textContent="≡";
  btn.setAttribute("aria-label","최근 일기 미리보기");
}
document.getElementById("diaryGridToggle").onclick=async()=>{
  const panel=document.getElementById("diaryGridPanel");
  const opening=panel.classList.contains("hidden");
  if(!opening){closeDiaryGrid();return}
  clearTimeout(diaryTimer);
  await saveDiary();
  document.getElementById("searchPanel").classList.add("hidden");
  document.getElementById("diaryEditor").classList.add("hidden");
  document.getElementById("dayDateNav").classList.add("hidden");
  document.getElementById("searchToggle").classList.add("hidden");
  document.getElementById("deleteDiary").classList.add("hidden");
  panel.classList.remove("hidden");
  const btn=document.getElementById("diaryGridToggle");
  btn.textContent="←";
  btn.setAttribute("aria-label","일기로 돌아가기");
  renderDiaryGrid();
};

/* SEARCH */

document.getElementById("searchToggle").onclick=()=>{
  const panel=document.getElementById("searchPanel");
  const editor=document.getElementById("diaryEditor");
  const opening=panel.classList.contains("hidden");

  panel.classList.toggle("hidden",!opening);
  editor.classList.toggle("hidden",opening);
  document.getElementById("dayDateNav").classList.toggle("hidden",opening);
  document.getElementById("deleteDiary").classList.toggle("hidden",opening);
  document.getElementById("diaryGridToggle").classList.toggle("hidden",opening);
  document.getElementById("searchToggle").textContent=opening?"←":"⌕";

  if(opening){
    document.getElementById("searchInput").focus();
  }
};

function setSearchMode(mode){
  searchMode=mode;
  document.getElementById("searchTitleBtn").classList.toggle("active",mode==="title");
  document.getElementById("searchContentBtn").classList.toggle("active",mode==="content");
  document.getElementById("searchTagBtn").classList.toggle("active",mode==="tag");
  document.getElementById("searchListBtn").classList.toggle("active",mode==="list");
  const input=document.getElementById("searchInput");
  input.classList.toggle("hidden",mode==="list");
  runSearch();
}

document.getElementById("searchTitleBtn").onclick=()=>setSearchMode("title");
document.getElementById("searchContentBtn").onclick=()=>setSearchMode("content");
document.getElementById("searchTagBtn").onclick=()=>setSearchMode("tag");
document.getElementById("searchListBtn").onclick=()=>setSearchMode("list");

document.getElementById("searchInput").oninput=runSearch;

function runSearch(){
  const q=document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const box=document.getElementById("searchResults");
  box.classList.toggle("list-mode",searchMode==="list");
  box.innerHTML="";

  if(!q && searchMode!=="list")return;

  const results=Object.entries(data.diaries)
    .filter(([date,e])=>{
      if(searchMode==="list"){
        return (e.title||"").trim()||(e.text||"").trim()||(e.tags||[]).length;
      }
      if(searchMode==="title"){
        return (e.title||"").toLowerCase().includes(q);
      }
      if(searchMode==="content"){
        return (e.text||"").toLowerCase().includes(q);
      }
      return (e.tags||[]).some(t=>t.toLowerCase().includes(q));
    })
    .sort((a,b)=>b[0].localeCompare(a[0]));

  results.forEach(([date,e])=>{
    const div=document.createElement("div");
    div.className="search-result";

    const d=document.createElement("div");
    d.className="search-result-date";
    d.textContent=e.title?`${date} · ${e.title}`:date;

    const p=document.createElement("div");
    p.className="search-preview";
    p.textContent=e.text||"";

    const tags=document.createElement("div");
    tags.className="tagline";
    tags.textContent=(e.tags||[]).map(t=>"#"+t).join(" ");

    if(searchMode==="list") div.append(d);
    else div.append(d,p,tags);

    div.onclick=()=>{
      selectedDate=date;
      renderDiary();
      document.getElementById("searchPanel").classList.add("hidden");
      document.getElementById("diaryEditor").classList.remove("hidden");
      document.querySelector(".day-header .date-nav").classList.remove("hidden");
      document.getElementById("deleteDiary").classList.remove("hidden");
      document.getElementById("searchToggle").textContent="⌕";
      document.getElementById("searchToggle").setAttribute("aria-label","검색");
      document.getElementById("deleteDiary").classList.remove("hidden");
      document.getElementById("diaryGridToggle").classList.remove("hidden");
      document.querySelector(".date-nav").classList.remove("hidden");
      document.getElementById("dayDateNav").classList.remove("hidden");
      document.getElementById("deleteDiary").classList.remove("hidden");
    };

    box.appendChild(div);
  });
}


/* =========================================================
   LOG (temporary sheet staging)
========================================================= */
let dayInnerMode="day",logTimer=null;
const LOG_TYPES=["탐색","설계","생성","편집","IN","DO"];
function emptyLog(){return {schedule:"",morect:{M:false,O:"",R:false,E:false,C:false,T:false},title1:"",record1:"",title2:"",record2:"",daily:"",main:[],sub:{minutes:"",chars:"",type:""},indo:{minutes:"",chars:"",type:""}}}
function currentLog(){data.logs??={};return data.logs[selectedDate]??(data.logs[selectedDate]=emptyLog())}
function logHasValue(x){return x&&JSON.stringify(x)!==JSON.stringify(emptyLog())}
async function saveLogSoon(){clearTimeout(logTimer);logTimer=setTimeout(async()=>{const x=currentLog();if(!logHasValue(x))delete data.logs[selectedDate];await saveAll()},250)}

function makeChip(chip,type){
  const el=document.createElement("div");
  el.className="chip"+(chip.done?" done":"");
  el.draggable=true;
  el.dataset.id=chip.id;
  el.dataset.type=type;

  const title=document.createElement("span");
  title.textContent=chip.title;
  el.appendChild(title);

  el.onclick=async()=>{
    if(el.dataset.suppressClick==="1"){el.dataset.suppressClick="0";return;}
    chip.done=!chip.done;
    await saveAll();
    renderPlan();
  };

  el.addEventListener("dragstart",e=>{
    el.dataset.suppressClick="1";
    el.classList.add("dragging");
    e.dataTransfer.setData("text/plain",
      JSON.stringify({id:chip.id,type}));
  });

  el.addEventListener("dragend",()=>{
    el.classList.remove("dragging");
  });

  return el;
}

function nextPlanOrder(type){
  const orders=data.plan[type].chips.map(c=>Number(c.order)||0);
  return (orders.length?Math.max(...orders):Date.now())+1;
}
function planChipsInZone(type,zone){
  return data.plan[type].chips
    .filter(c=>c.zone===zone)
    .sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
}

function enableDrop(el,type,zone){
  el.addEventListener("dragover",e=>{
    e.preventDefault();
    el.classList.add("drop-hover");
  });

  el.addEventListener("dragleave",()=>{
    el.classList.remove("drop-hover");
  });

  el.addEventListener("drop",async e=>{
    e.preventDefault();
    el.classList.remove("drop-hover");

    try{
      const payload=JSON.parse(e.dataTransfer.getData("text/plain"));
      if(payload.type!==type)return;

      const chip=data.plan[type].chips.find(c=>c.id===payload.id);
      if(!chip)return;

      chip.zone=zone;
      chip.order=nextPlanOrder(type);
      await saveAll();
      renderPlan();
    }catch{}
  });
}

function enableTrashDrop(el,type){
  el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("drop-hover");});
  el.addEventListener("dragleave",()=>el.classList.remove("drop-hover"));
  el.addEventListener("drop",async e=>{
    e.preventDefault();el.classList.remove("drop-hover");
    try{
      const payload=JSON.parse(e.dataTransfer.getData("text/plain"));
      if(payload.type!==type)return;
      data.plan[type].chips=data.plan[type].chips.filter(c=>c.id!==payload.id);
      await saveAll();renderPlan();
    }catch{}
  });
}

function ensureWeekdaySlots(){
  data.plan.weekday.slots ??=[];
  if(data.plan.weekday.slots.length)return;
  data.plan.weekday.slots=[
    ...WEEKDAY_NAMES.map((name,i)=>({id:"base-day-"+i,type:"day",name,zone:"day-"+i})),
    {id:"base-week",type:"week",name:"주간",zone:"any-week"}
  ];
}
function nextWeekdayName(){
  ensureWeekdaySlots();
  const days=data.plan.weekday.slots.filter(x=>x.type==="day");
  if(!days.length)return "월";
  const last=WEEKDAY_NAMES.indexOf(days[days.length-1].name);
  return WEEKDAY_NAMES[(last+1+7)%7];
}
function newWeekdayZone(type){return (type==="day"?"extra-day-":"extra-week-")+uid();}

function renderWeekday(){
  ensureWeekdaySlots();
  const loose=document.getElementById("weekdayLoose");
  loose.innerHTML="";
  enableDrop(loose,"weekday","loose");

  planChipsInZone("weekday","loose")
    .forEach(c=>loose.appendChild(makeChip(c,"weekday")));

  const board=document.getElementById("weekdayBoard");
  board.innerHTML="";

  data.plan.weekday.slots.forEach(slot=>{
    const row=document.createElement("div");
    row.className="day-row";
    if(slot.type==="day"&&slot.name==="토") row.classList.add("saturday");
    if(slot.type==="day"&&slot.name==="일") row.classList.add("sunday");
    if(slot.type==="week") row.classList.add("anyweek");

    const label=document.createElement("div");
    label.className="day-label";
    label.textContent=slot.name;

    const zone=document.createElement("div");
    zone.className="drop-zone";
    zone.dataset.zone=slot.zone;
    enableDrop(zone,"weekday",slot.zone);
    planChipsInZone("weekday",slot.zone)
      .forEach(c=>zone.appendChild(makeChip(c,"weekday")));

    const minus=document.createElement("button");
    minus.className="day-minus";
    minus.textContent="−";
    minus.setAttribute("aria-label",slot.name+" 칸 삭제");
    minus.onclick=async()=>{
      const hasChips=data.plan.weekday.chips.some(c=>c.zone===slot.zone);
      if(hasChips&&!await confirmBox("이 칸과 이 칸에 남아 있는 항목을 모두 삭제할까요?"))return;
      data.plan.weekday.chips=data.plan.weekday.chips.filter(c=>c.zone!==slot.zone);
      data.plan.weekday.slots=data.plan.weekday.slots.filter(x=>x.id!==slot.id);
      await saveAll();renderWeekday();
    };

    row.append(label,zone,minus);
    board.appendChild(row);
  });
}

/* WEEKLY */

function ensureInitialWeeks(){
  if(data.plan.weekly.weeks.length)return;

  let key=weekKey(isoWeekInfo(new Date()));

  for(let i=0;i<5;i++){
    data.plan.weekly.weeks.push(key);
    key=nextWeekKey(key);
  }
}

function renderWeekly(){
  ensureInitialWeeks();

  const loose=document.getElementById("weeklyLoose");
  loose.innerHTML="";
  enableDrop(loose,"weekly","loose");

  planChipsInZone("weekly","loose")
    .forEach(c=>loose.appendChild(makeChip(c,"weekly")));

  const rows=document.getElementById("weekRows");
  rows.innerHTML="";

  const currentKey=weekKey(isoWeekInfo(new Date()));

  data.plan.weekly.weeks.sort((a,b)=>
    infoFromWeekKey(a).monday-infoFromWeekKey(b).monday
  );

  data.plan.weekly.weeks.forEach(key=>{
    const info=infoFromWeekKey(key);

    const row=document.createElement("div");
    row.className="week-row"+(key===currentKey?" current":"");

    const head=document.createElement("div");
    head.className="week-head";

    const number=document.createElement("div");
    number.className="week-number";
    number.textContent=`${info.week} / ${info.totalWeeks}`;

    const dates=document.createElement("div");
    dates.className="week-dates";
    dates.textContent=`${info.monday.getMonth()+1}/${info.monday.getDate()}\n${info.sunday.getMonth()+1}/${info.sunday.getDate()}`;
    dates.style.whiteSpace="pre-line";

    const minus=document.createElement("button");
    minus.className="week-minus";
    minus.textContent="−";

    minus.onclick=async()=>{
      const hasChips=data.plan.weekly.chips.some(c=>c.zone===key);

      if(hasChips){
        const ok=await confirmBox(
          "이 주와 이 주에 남아 있는 항목을 모두 삭제할까요?"
        );
        if(!ok)return;
      }

      data.plan.weekly.chips=
        data.plan.weekly.chips.filter(c=>c.zone!==key);

      data.plan.weekly.weeks=
        data.plan.weekly.weeks.filter(w=>w!==key);

      await saveAll();
      renderWeekly();
    };

    head.append(dates,number,minus);

    const zone=document.createElement("div");
    zone.className="drop-zone";
    zone.dataset.zone=key;
    enableDrop(zone,"weekly",key);

    planChipsInZone("weekly",key)
      .forEach(c=>zone.appendChild(makeChip(c,"weekly")));

    row.append(head,zone);
    rows.appendChild(row);
  });
}

  const key=sorted.length
    ? prevWeekKey(sorted[0])
    : weekKey(isoWeekInfo(new Date()));

  if(!data.plan.weekly.weeks.includes(key)){
    data.plan.weekly.weeks.push(key);

let annualSelectedYear=new Date().getFullYear();
let annualEditingId=null;
const ANNUAL_PALETTE=["#c98f86","#8fa8bd","#b39ab8","#c5a56f","#93a98e","#b88972","#8f9ab5","#c19aab"];
function annualSegments(){data.annual??={segments:[],colors:{},order:[],hidden:[]};data.annual.segments??=[];data.annual.colors??={};data.annual.order??=[];data.annual.hidden??=[];data.annual.mobileOrder??=[];return data.annual.segments;}
function annualColors(){annualSegments();return data.annual.colors;}
function annualOrder(){annualSegments();return data.annual.order;}
function annualHidden(){annualSegments();return data.annual.hidden;}
function annualProjectVisible(project){return !annualHidden().includes(project);}
function orderedAnnualProjects(segs){
  const found=[...new Set(segs.map(s=>s.project))],order=annualOrder();
  return [...order.filter(p=>found.includes(p)),...found.filter(p=>!order.includes(p))];
}
async function reorderAnnualProject(dragged,target,after,segs){
  if(!dragged||!target||dragged===target)return;
  const projects=orderedAnnualProjects(segs);
  const from=projects.indexOf(dragged);if(from<0)return;
  projects.splice(from,1);
  let to=projects.indexOf(target);if(to<0)return;

async function completeTodo(list,id){
  const index=data.todo[list].findIndex(x=>x.id===id);
  if(index<0)return;

  const item=data.todo[list][index];
  data.todo[list].splice(index,1);

  data.todo.completed.unshift({
    id:item.id,
    title:item.title,
    completedDate:list==="schedule" ? item.date : localDateString()
  });

  await saveAll();
  renderTodo();
}

async function deleteTodoItem(list,id){
  data.todo[list]=data.todo[list].filter(x=>x.id!==id);
  await saveAll();
  renderTodo();
}

async function saveTodoTitleEdit(item,list,value){
  const title=value.trim();
  if(!title)return false;
  const target=data.todo[list].find(x=>x.id===item.id);
  if(!target)return false;
  target.title=title;
  await saveAll();
  return true;
}

function startTodoTitleEdit(item,list,titleEl){
  if(titleEl.dataset.editing==="1")return;
  titleEl.dataset.editing="1";

  const input=document.createElement("input");
  input.type="text";
  input.className="todo-title-edit";
  input.value=item.title;
  input.setAttribute("aria-label","할 일 수정");

  let finished=false;
  const original=item.title;

  const finish=async save=>{
    if(finished)return;
    finished=true;
    if(save){
      const ok=await saveTodoTitleEdit(item,list,input.value);
      if(!ok){
        item.title=original;
      }
    }
    renderTodo();
  };

  input.addEventListener("click",e=>e.stopPropagation());
  input.addEventListener("pointerdown",e=>e.stopPropagation());
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();finish(true);}
    else if(e.key==="Escape"){e.preventDefault();finish(false);}
  });
  input.addEventListener("blur",()=>finish(true));

  titleEl.replaceWith(input);
  input.focus();
  input.setSelectionRange(input.value.length,input.value.length);
}

function makeTodoItem(item,list,index){
  const el=document.createElement("div");
  el.className="todo-item";
  el.draggable=window.matchMedia('(pointer:fine)').matches;
  el.dataset.id=item.id;
  el.dataset.list=list;

  const check=document.createElement("button");
  check.className="check";
  check.onclick=()=>completeTodo(list,item.id);

  const title=document.createElement("div");
  title.className="todo-title";
  title.textContent=item.title;
  title.title="클릭하여 수정";
  title.onclick=e=>{
    e.stopPropagation();
    startTodoTitleEdit(item,list,title);
  };

  const dateLabel=document.createElement("div");
  dateLabel.className="schedule-date";
  dateLabel.textContent=list==="schedule" ? item.date.slice(5).replace("-",".") : "";

  const handle=document.createElement("div");
  handle.className="drag-handle";
  handle.textContent="≡";
  handle.oncontextmenu=e=>e.preventDefault();

  const del=document.createElement("button");
  del.className="delete-mini";
  del.textContent="×";
  del.onclick=()=>deleteTodoItem(list,item.id);

  el.addEventListener("dragstart",e=>{
    e.dataTransfer.setData("text/plain",
      JSON.stringify({
        kind:"todo",
        id:item.id,
        from:list,
        index
      })
    );
  });

  el.addEventListener("dragover",e=>{
    e.preventDefault();
  });

  el.addEventListener("drop",async e=>{
    e.preventDefault();
    e.stopPropagation();

    let p;
    try{p=JSON.parse(e.dataTransfer.getData("text/plain"))}
    catch{return}

    if(p.kind!=="todo")return;

    moveTodo(p.from,p.id,list,index);
  });

  el.append(check);
  if(list==="schedule")el.append(dateLabel);
  el.append(title,handle,del);
  return el;

async function moveTodo(from,id,to,targetIndex){
  const fromArr=data.todo[from];
  const index=fromArr.findIndex(x=>x.id===id);
  if(index<0)return;

  const [item]=fromArr.splice(index,1);
  if(to==="schedule"&&!item.date)item.date=localDateString();

  let adjusted=targetIndex;

  if(from===to && index<targetIndex){
    adjusted--;
  }

  data.todo[to].splice(Math.max(0,adjusted),0,item);

  await saveAll();
  renderTodo();
}

function enableTodoListDrop(el,list){
  el.ondragover=e=>e.preventDefault();

  el.ondrop=async e=>{
    if(e.target.closest(".todo-item"))return;

    e.preventDefault();

    let p;
    try{p=JSON.parse(e.dataTransfer.getData("text/plain"))}
    catch{return}

    if(p.kind!=="todo")return;

    moveTodo(p.from,p.id,list,data.todo[list].length);
  };
}

  });

  enableTodoListDrop(box,list);

async function editCompletedDate(item,anchor){
  const picker=document.createElement("input");
  picker.type="date";
  picker.value=item.completedDate || localDateString();
  const rect=anchor?.getBoundingClientRect();
  picker.style.position="fixed";
  picker.style.left=(rect ? rect.left : 12)+"px";
  picker.style.top=(rect ? rect.bottom : 12)+"px";
  picker.style.width="1px";picker.style.height="1px";picker.style.padding="0";picker.style.border="0";
  picker.style.opacity="0.01";picker.style.pointerEvents="none";picker.style.zIndex="9999";
  document.body.appendChild(picker);

  picker.onchange=async()=>{
    if(picker.value){
      item.completedDate=picker.value;
      await saveAll();
      renderTodo();
    }
    picker.remove();
  };
  picker.onblur=()=>setTimeout(()=>picker.remove(),200);

  if(picker.showPicker) picker.showPicker();
  else picker.click();
}

function renderTagPresetSettings(){
  const box=document.getElementById("tagPresetList");
  if(!box)return;
  box.innerHTML="";
  let dragIndex=null;
  getTagPresets().forEach((tag,index)=>{
    const row=document.createElement("div");
    row.className="tag-preset-item";
    row.draggable=true;
    const input=document.createElement("input");
    input.value=tag;
    const actions=document.createElement("div");
    actions.className="tag-preset-actions";
    const up=document.createElement("button"); up.textContent="↑"; up.title="위로";
    const down=document.createElement("button"); down.textContent="↓"; down.title="아래로";
    const save=document.createElement("button"); save.textContent="수정";
    const del=document.createElement("button"); del.textContent="삭제"; del.className="preset-delete";

    async function movePreset(to){
      if(to<0||to>=data.tagPresets.length||to===index)return;
      const [moved]=data.tagPresets.splice(index,1);
      data.tagPresets.splice(to,0,moved);
      await saveAll(); renderDiary(); renderTagPresetSettings();
    }
    up.onclick=()=>movePreset(index-1);
    down.onclick=()=>movePreset(index+1);
    up.disabled=index===0; down.disabled=index===getTagPresets().length-1;

    row.addEventListener("dragstart",e=>{dragIndex=index;row.classList.add("dragging");e.dataTransfer.effectAllowed="move";});
    row.addEventListener("dragend",()=>{dragIndex=null;row.classList.remove("dragging");box.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));});
    row.addEventListener("dragover",e=>{e.preventDefault();if(dragIndex!==null&&dragIndex!==index)row.classList.add("drag-over");});
    row.addEventListener("dragleave",()=>row.classList.remove("drag-over"));
    row.addEventListener("drop",async e=>{e.preventDefault();row.classList.remove("drag-over");if(dragIndex===null||dragIndex===index)return;const [moved]=data.tagPresets.splice(dragIndex,1);let to=index;if(dragIndex<index)to--;data.tagPresets.splice(to,0,moved);await saveAll();renderDiary();renderTagPresetSettings();});

    save.onclick=async()=>{
      const next=input.value.trim();
      if(!next||next===tag)return;
      if(getTagPresets().includes(next)){alert("이미 있는 태그입니다.");input.value=tag;return;}
      Object.values(data.diaries).forEach(entry=>{if(Array.isArray(entry.tags))entry.tags=[...new Set(entry.tags.map(t=>t===tag?next:t))];});
      data.tagPresets[index]=next;
      if(activeQuickTags.delete(tag)) activeQuickTags.add(next);
      await saveAll(); renderDiary(); renderTagPresetSettings();
    };
    del.onclick=async()=>{
      Object.values(data.diaries).forEach(entry=>{if(Array.isArray(entry.tags))entry.tags=entry.tags.filter(t=>t!==tag);});
      data.tagPresets.splice(index,1); activeQuickTags.delete(tag);
      await saveAll(); renderDiary(); renderTagPresetSettings();
    };
    actions.append(up,down,save,del); row.append(input,actions); box.appendChild(row);
  });
}

/* =========================================================
   PLAN TOUCH GESTURES
   tap = complete/delete confirm / move = drag
========================================================= */
let pointerDrag=null;
document.addEventListener("pointerdown",e=>{
  const chip=e.target.closest(".chip");
  if(!chip||e.pointerType==="mouse")return;
  const startX=e.clientX,startY=e.clientY;
  let dragging=false;
  function move(ev){
    if(!dragging&&Math.hypot(ev.clientX-startX,ev.clientY-startY)>10){
      dragging=true;chip.dataset.suppressClick="1";
      pointerDrag={chip,id:chip.dataset.id,type:chip.dataset.type};chip.style.opacity=".4";
    }
    if(!dragging)return;ev.preventDefault();
    const rawTarget=document.elementFromPoint(ev.clientX,ev.clientY);
    const target=rawTarget?.closest(".plan-trash,.loose-area,.day-row,.week-row");
    document.querySelectorAll(".drop-hover").forEach(x=>x.classList.remove("drop-hover"));
    if(target)target.classList.add("drop-hover");
  }
  async function up(ev){
    cleanup();if(!dragging){pointerDrag=null;return;}
    const drag=pointerDrag;pointerDrag=null;chip.style.opacity="";
    const rawTarget=document.elementFromPoint(ev.clientX,ev.clientY);
    const target=rawTarget?.closest(".plan-trash,.loose-area,.day-row,.week-row");
    document.querySelectorAll(".drop-hover").forEach(x=>x.classList.remove("drop-hover"));
    if(!target||!drag)return;
    if(target.classList.contains("plan-trash")){
      const trashType=target.id==="weekdayTrash"?"weekday":"weekly";
      if(trashType===drag.type){
        data.plan[drag.type].chips=data.plan[drag.type].chips.filter(c=>c.id!==drag.id);
        await saveAll();renderPlan();
      }
      return;
    }
    let zone=null;
    if(target.classList.contains("loose-area")){
      zone="loose";
    }else if(target.classList.contains("week-row")){
      if(drag.type!=="weekly")return;
      const i=[...document.querySelectorAll("#weekRows .week-row")].indexOf(target);
      zone=data.plan.weekly.weeks[i];
    }else if(target.classList.contains("day-row")){
      if(drag.type!=="weekday")return;
      const i=[...document.querySelectorAll("#weekdayBoard .day-row")].indexOf(target);
      ensureWeekdaySlots();
      zone=data.plan.weekday.slots[i]?.zone||null;
    }
    const item=data.plan[drag.type].chips.find(c=>c.id===drag.id);
    if(item&&zone){
      item.zone=zone;
      item.order=nextPlanOrder(drag.type);
      await saveAll();
      renderPlan();
    }
  }
  function cancel(){cleanup();if(pointerDrag?.chip)pointerDrag.chip.style.opacity="";pointerDrag=null;}
  function cleanup(){document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",cancel);}
  document.addEventListener("pointermove",move,{passive:false});
  document.addEventListener("pointerup",up,{once:true});
  document.addEventListener("pointercancel",cancel,{once:true});
});

  document.addEventListener("pointerup",up,{once:true});
  document.addEventListener("pointercancel",cancel,{once:true});
});

function render(){const list=filtered();el("ideaList").innerHTML=list.length?list.map(e=>`<article class="idea-entry" data-edit="${esc(e.id)}"><div class="idea-entry-head"><span>${esc(e.date)}</span><span class="idea-cat">[${esc(catName(e.categoryId))}]</span>${e.ai?'<span class="idea-ai-mark">(AI)</span>':''}<span class="idea-entry-actions"><button data-editbtn="${esc(e.id)}">수정</button><button data-del="${esc(e.id)}">삭제</button></span></div><div class="idea-entry-text">${esc(e.text)}</div></article>`).join(""):'<div class="idea-empty">아직 IDEA가 없습니다.</div>';}
window.renderIdea=render;
function resetForm(){editing=null;el("ideaDate").value=localDateString();el("ideaAI").checked=false;el("ideaText").value="";el("ideaCancel").style.display="none";status("내용을 입력하면 자동으로 저장됩니다.")}
function edit(id){const e=entries().find(x=>x.id===id);if(!e)return;editing=id;el("ideaDate").value=e.date;el("ideaCategory").value=e.categoryId;el("ideaAI").checked=!!e.ai;el("ideaText").value=e.text;el("ideaCancel").style.display="inline-block";el("ideaText").focus();window.scrollTo({top:0,behavior:"smooth"})}
async function autoSave(){if(saving)return;const text=el("ideaText").value.trim();if(!text){status("내용을 입력하면 자동으로 저장됩니다.");return}saving=true;const obj={date:el("ideaDate").value||localDateString(),categoryId:el("ideaCategory").value,ai:el("ideaAI").checked,text,updatedAt:Date.now()};if(editing){const i=entries().findIndex(e=>e.id===editing);if(i>=0)entries()[i]={...entries()[i],...obj};else editing=null}if(!editing){const id=uid();entries().push({id,createdAt:Date.now(),...obj});editing=id;el("ideaCancel").style.display="inline-block"}await saveAll();render();status("자동 저장됨");saving=false}
function schedule(){clearTimeout(timer);timer=setTimeout(autoSave,450)}
function showRandom(){if(!entries().length){alert("저장된 IDEA가 없습니다.");return}const e=entries()[Math.floor(Math.random()*entries().length)];el("ideaRandomBody").innerHTML=`<div class="idea-random-card"><div class="idea-random-meta">${esc(e.date)} · ${esc(catName(e.categoryId))}${e.ai?' · AI':''}</div><div class="idea-random-text">${esc(e.text)}</div><div class="idea-random-actions"><button class="idea-btn" id="ideaRandomAgain">다시 뽑기</button></div></div>`;el("ideaRandomModal").classList.remove("hidden");el("ideaRandomAgain").onclick=showRandom;}
function renderCategorySettings(){const box=el("ideaCatList");if(!box)return;box.innerHTML="";cats().forEach((c,index)=>{const row=document.createElement("div");row.className="tag-preset-item";const input=document.createElement("input");input.value=c.name;const actions=document.createElement("div");actions.className="tag-preset-actions";const up=document.createElement("button");up.textContent="↑";const down=document.createElement("button");down.textContent="↓";const save=document.createElement("button");save.textContent="수정";const del=document.createElement("button");del.textContent="삭제";del.className="preset-delete";up.disabled=index===0;down.disabled=index===cats().length-1;up.onclick=async()=>{[cats()[index-1],cats()[index]]=[cats()[index],cats()[index-1]];await saveAll();renderCats();renderCategorySettings()};down.onclick=async()=>{[cats()[index+1],cats()[index]]=[cats()[index],cats()[index+1]];await saveAll();renderCats();renderCategorySettings()};save.onclick=async()=>{const n=input.value.trim();if(!n||cats().some(x=>x.id!==c.id&&x.name===n)){input.value=c.name;return}c.name=n;await saveAll();renderCats();render();renderCategorySettings()};del.onclick=async()=>{if(cats().length<=1)return;if(entries().some(x=>x.categoryId===c.id)){alert("이 분류를 사용하는 IDEA가 있습니다. 먼저 분류를 바꿔 주세요.");return}cats().splice(index,1);await saveAll();renderCats();renderCategorySettings()};actions.append(up,down,save,del);row.append(input,actions);box.appendChild(row)});}
window.renderIdeaCategorySettings=renderCategorySettings;
el("ideaAddCat").onclick=async()=>{const n=el("ideaNewCat").value.trim();if(!n||cats().some(c=>c.name===n))return;cats().push({id:uid(),name:n});el("ideaNewCat").value="";await saveAll();renderCats();renderCategorySettings()};
el("ideaNewCat").addEventListener("keydown",e=>{if(e.key==="Enter")el("ideaAddCat").click()});
el("ideaCancel").onclick=resetForm;el("ideaText").addEventListener("input",schedule);["ideaDate","ideaCategory","ideaAI"].forEach(id=>el(id).addEventListener("change",schedule));["ideaSearch","ideaFilterCat","ideaFilterAI","ideaSort"].forEach(id=>el(id).addEventListener(id==="ideaSearch"?"input":"change",render));
el("ideaThisYear").checked=data.idea.settings.thisYear!==false;el("ideaThisYear").addEventListener("change",async()=>{data.idea.settings.thisYear=el("ideaThisYear").checked;await saveAll();render()});
el("ideaList").onclick=async e=>{const d=e.target.closest("[data-del]");if(d){e.stopPropagation();if(confirm("이 IDEA를 삭제할까요?")){data.idea.entries=data.idea.entries.filter(x=>x.id!==d.dataset.del);await saveAll();if(editing===d.dataset.del)resetForm();render()}return}const ed=e.target.closest("[data-editbtn]")||e.target.closest("[data-edit]");if(ed)edit(ed.dataset.editbtn||ed.dataset.edit)};
el("ideaRandomBtn").onclick=showRandom;el("ideaRandomClose").onclick=()=>el("ideaRandomModal").classList.add("hidden");el("ideaRandomModal").onclick=e=>{if(e.target===el("ideaRandomModal"))el("ideaRandomModal").classList.add("hidden")};
el("ideaExport").onclick=()=>{const from=el("ideaExportFrom").value,to=el("ideaExportTo").value;if(!from||!to)return;if(from>to){alert("기간을 확인해주세요.");return}const a=[...entries()].filter(e=>e.date>=from&&e.date<=to).sort((x,y)=>String(x.date).localeCompare(String(y.date))||((x.createdAt||0)-(y.createdAt||0)));let md="",last="";for(const e of a){if(e.date!==last){if(md)md+="\n";md+=`### ${e.date}\n\n`;last=e.date}md+=`[${catName(e.categoryId)}] ${String(e.text).trim()}${e.ai?" (AI)":""}\n\n`}downloadText(`IDEA_${from}_${to}.md`,md.trimEnd()+"\n","text/markdown")};
renderCats();resetForm();render();
})();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Service worker registration failed:", err));
  });
}
</script>
